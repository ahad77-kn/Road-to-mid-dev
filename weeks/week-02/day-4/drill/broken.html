<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Broken — spanning tiles</title>
  <link rel="stylesheet" href="broken.css">
</head>
<body>
  <h1>Explore</h1>
  <div class="grid">
    <figure class="tile wide"><img src="a.jpg" alt="Sunrise over the harbour"></figure>
    <figure class="tile"><img src="b.jpg" alt="A street market at noon"></figure>
    <figure class="tile tall"><img src="c.jpg" alt="Climber on a rock face"></figure>
    <figure class="tile"><img src="d.jpg"></figure>
    <figure class="tile"><img src="e.jpg" alt="Two cyclists on a bridge"></figure>
    <figure class="tile huge"><img src="f.jpg" alt="Fireworks above a stadium"></figure>
  </div>
</body>
</html>
