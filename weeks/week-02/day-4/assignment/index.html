<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Explore Grid</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Instagram Explore Gallery</h1>
    <div class="gallery">
        <div class="tile large">
            <img src="https://picsum.photos/600/600?random=1" alt="Gallery Image 1">
        </div>
        <div class="tile">
            <img src="https://picsum.photos/600/600?random=2" alt="Gallery Image 2">
        </div>
        <div class="tile">
              <img src="https://picsum.photos/600/600?random=3" alt="Gallery Image 3">
        </div>
        <div class="tile tall">
                <img src="https://picsum.photos/600/600?random=4" alt="Gallery Image 4">
        </div>
        <div class="tile">
            <img src="https://picsum.photos/600/600?random=5" alt="Gallery Image 5">
        </div>
        <div class="tile">
            <img src="https://picsum.photos/600/600?random=6" alt="Gallery Image 6">
        </div>
        <div class="tile large">
            <img src="https://picsum.photos/600/600?random=7" alt="Gallery Image 7">
        </div>
        <div class="tile">
            <img src="https://picsum.photos/600/600?random=8" alt="Gallery Image 8">
        </div>
        <div class="tile">
            <img src="https://picsum.photos/600/600?random=9" alt="Gallery Image 9">
        </div>
        <div class="tile">
            <img src="https://picsum.photos/600/600?random=10" alt="Gallery Image 10">
        </div>
        <div class="tile tall">
            <img src="https://picsum.photos/600/600?random=11" alt="Gallery Image 11">
        </div>
        <div class="tile">
            <img src="https://picsum.photos/600/600?random=12" alt="Gallery Image 12">
        </div>
    </div>

</body>
</html>
