<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Broken — video shelf</title>
  <link rel="stylesheet" href="broken.css">
</head>
<body>
  <div class="page">
    <aside class="rail">
      <button class="rail-item">Home</button>
      <button class="rail-item">Subscriptions</button>
      <button class="rail-item">History</button>
    </aside>

    <main class="shelf">
      <article class="video">
        <div class="thumb"></div>
        <div class="meta">
          <div class="avatar"></div>
          <div class="text">
            <h2 class="video-title">Understanding CSS Grid minmax and auto-fit in one sitting without losing your mind</h2>
            <p class="channel">https://videos.example.com/watch?v=dQw4w9WgXcQ&amp;list=PLaVeryLongPlaylistIdentifier1234567890abcdefghijklmnop</p>
            <span class="duration">12:04</span>
          </div>
        </div>
      </article>

      <article class="video">
        <div class="thumb"></div>
        <div class="meta">
          <div class="avatar"></div>
          <div class="text">
            <h2 class="video-title">Short title</h2>
            <p class="channel">Normal Channel</p>
            <span class="duration">4:31</span>
          </div>
        </div>
      </article>
    </main>
  </div>
</body>
</html>
