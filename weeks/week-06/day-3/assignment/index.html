<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="calculator">

        <section class="display">
            <div id="expression" class="expression"></div>
            <div id="current-entry" class="current-entry">0</div>
        </section>
        <section id="buttons" class="buttons">
            <button class="clear" data-action="clear">C</button>
            <button class="clear" data-action="clear-entry">CE</button>
            <button data-operator="%">%</button>
            <button data-operator="/">÷</button>

            <button data-digit="7">7</button>
            <button data-digit="8">8</button>
            <button data-digit="9">9</button>
            <button data-operator="*">×</button>

            <button data-digit="4">4</button>
            <button data-digit="5">5</button>
            <button data-digit="6">6</button>
            <button data-operator="-">−</button>

            <button data-digit="1">1</button>
            <button data-digit="2">2</button>
            <button data-digit="3">3</button>
            <button data-operator="+">+</button>

               <button class="zero" data-digit="0">0</button>
            <button data-digit=".">.</button>
            <button class="equals" data-action="equals">=</button>

        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
